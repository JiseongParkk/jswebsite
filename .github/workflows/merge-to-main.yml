name: Merge to main workflows
# Run action on push in mater branch
on:
  push:
    branches:
    - main

jobs:
  update_release_draft:
    # This inherited release automation belongs to the upstream theme.
    if: github.repository == 'hugo-toha/toha'
    runs-on: ubuntu-latest
    steps:
    # Create/Update release draft
    - uses: release-drafter/release-drafter@v7.10.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
