baseURL: "https://jiseongparkk.github.io/jswebsite/"
title: "박지성 | 바이오메디컬공학 · 의료영상"
languageCode: ko-KR
defaultContentLanguage: ko
enableRobotsTXT: true
disableKinds: [taxonomy, term, RSS]
languages:
  ko:
    languageName: 한국어
    languageCode: ko-KR
    locale: ko-KR
    weight: 1
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
outputs:
  home: [HTML]
markup:
  goldmark:
    renderer:
      unsafe: false
params:
  medicalPortfolio:
    enable: true
    animation: true
  description: "바이오메디컬공학을 전공하는 박지성의 의료영상 학습 포트폴리오. MRI와 CT, 영상 처리와 재구성에 대한 관심을 기록합니다."
  gitRepo: https://github.com/JiseongParkk/jswebsite
  gitBranch: main
  features:
    portfolio:
      enable: true
    blog:
      enable: false
    notes:
      enable: false
    analytics:
      enable: false
    comment:
      enable: false
