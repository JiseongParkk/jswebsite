{{ $a := site.Data.portfolio.activity }}
<section class="section activity" id="activity" aria-labelledby="activity-title"><div class="wrap"><p class="eyebrow">{{ $a.eyebrow }}</p><div class="section-head"><div><h2 class="section-heading" id="activity-title">{{ $a.title }}</h2><p class="lede">{{ $a.intro }}</p></div><div class="activity-meta"><span class="status">{{ $a.status }}</span><p>{{ $a.period }}</p><p>{{ $a.type }}</p></div></div><details class="activity-disclosure"><summary>{{ i18n "activityDetails" }} <span aria-hidden="true">＋</span></summary><dl class="activity-details">{{ range $a.items }}<div><dt>{{ .label }}</dt><dd>{{ .text }}</dd></div>{{ end }}</dl></details><div class="links activity-links"><a class="button" href="{{ $a.repo }}">{{ i18n "viewRepository" }} <span aria-hidden="true">↗</span></a><a class="button" href="{{ $a.history }}">{{ i18n "viewActivity" }} <span aria-hidden="true">↗</span></a></div></div></section>
