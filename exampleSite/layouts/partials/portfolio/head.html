<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.Title }}</title>
<meta name="description" content="{{ site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" type="image/svg+xml" href="{{ "images/portfolio/mark.svg" | relURL }}">
{{ $styles := resources.Match "styles/portfolio/*.css" }}
{{ with $styles }}
  {{ $style := . | resources.Concat "styles/medical-portfolio.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
{{ end }}

<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="{{ site.Home.Permalink }}">
<meta property="og:image" content="{{ "images/portfolio/mark.svg" | absURL }}">
<meta name="theme-color" content="#082b38">
