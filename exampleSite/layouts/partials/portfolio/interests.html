{{ $s := site.Data.portfolio.interests }}
<section class="section interests" id="interests" aria-labelledby="interests-title"><div class="wrap"><div class="section-head"><div><p class="eyebrow">{{ $s.eyebrow }}</p><h2 class="section-heading" id="interests-title">{{ $s.title }}</h2><p class="lede">{{ $s.intro }}</p></div></div><div class="interest-grid">{{ range $s.items }}<article class="interest-card"><div class="card-top"><span>{{ .number }}</span><span>{{ .tag }}</span></div><h3>{{ .title }}</h3><p>{{ .body }}</p><p class="next-step">{{ .next }}</p></article>{{ end }}</div></div></section>
